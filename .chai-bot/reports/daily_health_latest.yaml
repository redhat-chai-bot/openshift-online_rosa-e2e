    diagnosis: 'Classification: Product bug. The hosted-cluster resource is created on the management
      cluster but its entire status block stays unpopulated, so the hosted-control-plane operator never
      reconciled it and the service never progressed past installing; all downstream failures (kubeconfig
      retrieval rejected for a non-ready cluster, diagnostics gathering without a server, RBAC-denied
      collection) are cascade. Confidence moderate: this job variant is the only one that deploys a candidate
      hosted-control-plane operator build before provisioning, and the equivalent job at the same version
      in the standard staging variant passed 6 of 7 runs in the same window, which points at the candidate
      operator build; the specific operator build identifier was not extracted from the artifacts, so
      that correlation is unconfirmed. Secondary finding: the install-report step prints an all-healthy
      verdict after recording that it could not retrieve cluster operators or nodes.'
