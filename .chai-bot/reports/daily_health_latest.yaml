methodology:
  outcomes: Count only SUCCESS and FAILURE builds started within each half-open seven-day window and completed by
    2026-10-23T14:30:00Z (Started plus Duration nanoseconds). Later builds are excluded.
  rates: Weighted completed-run rates; headline percentages rounded to integers, detailed rates retain source precision.
    No-run rates are null.
  trend: 'Current minus previous percentage points: at least 10 improving, at most -10 degrading, otherwise stable;
    missing rates mean insufficient_data.'
  gating: Explicit job gating overrides category gating; category default is false. Team and labels use job overrides
    when present.
  consecutive_failures: Current-window counted builds sorted by Started descending and numeric build ID descending;
    stop at first SUCCESS.
  latest_failure: Most recent counted failure in the current window; dates use build Started in UTC. A zero streak
    can coexist with failures earlier in the window.
  analysis: Only the 18 selected failed runs are analyzed. Diagnoses describe those runs, not subsequent passing
    runs. Jobs with no current-window failures or no selected analysis have empty diagnostic fields.
  classification: Only supported findings use Product bug, Env/config issue, Test bug, or Resilience / de-flake;
    unsupported causes remain empty. A supported secondary test defect does not establish the initial failure cause.
  fetch_error: Unknown counts and pass rate are -1; total and consecutive_failures are 0; classification is fetch_error.
    Aggregate metrics include observed runs only and mark incomplete coverage.
  privacy: Only public registry metadata and sanitized factual diagnoses are included; routing metadata, identities,
    issue content, private endpoints, resource identifiers and raw log excerpts are omitted.
