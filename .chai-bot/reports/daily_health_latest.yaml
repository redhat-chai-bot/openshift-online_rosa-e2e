  terminal_state_handling: SUCCESS is pass; every other terminal state is failed. Observed terminal states in the
    current window were SUCCESS and FAILURE only (no ABORTED, no ERROR).
  pending_handling: Runs with no Result or a non-terminal Result are excluded before counting. 1 such run was excluded.
  window_rule: A run is counted in a window by its START time (Started), not its completion time. This differs from
    the 2026-11-22 artifact, which windowed by completion time; current and previous counts are therefore not directly
    comparable with that run.
  dedup_rule: Deduplicated on (prow_job, build ID). 0 duplicates across 3658 collected build rows.
  pagination: 'Each job history was read from the Prow job-history endpoint. One 20-build page covered both windows
    for every job: 203 jobs reached a build older than the previous-window start, 4 exhausted pagination. 0 jobs
    hit the page cap. 1 job could not be read at all (HTTP 500).'
  informing_rule: 'informing: true jobs are excluded from the overall, gating, non-gating and per-category pass
    rates and from category health, in BOTH windows; their history is still collected and reported.'
  gating_rule: Effective gating is the job-level gating value when present, otherwise the category default. 32 jobs
    carry a job-level override; 91 non-informing jobs are effectively gating.
  failure_analysis_scope: Five categories were selected for diagnosis plus one required non-all-green fallback candidate
    outside them; 14 jobs carry a diagnosis. Diagnoses summarize public Prow logs/artifacts and public repository
    source only, and preserve stated uncertainty.
  artifact_access_limit: Anonymous GCS listing and object reads for the artifact bucket are denied (HTTP 401/403);
    artifacts were read through the authorized CI artifact tooling only.
  consecutive_failure_limit: Streaks are computed over the builds fetched per job (one 20-build page). A streak
    equal to the fetched build count is a lower bound and is flagged with consecutive_failures_is_lower_bound; 10
    jobs are so flagged, 5 of them at the 20-build page boundary.
  category_line_rule: 4 categories contain only informing jobs and therefore have no rate and no category line;
    1 category (sre-operator-e2e) has non-informing jobs but zero counted runs, reported as N/A (0/0), never 0%.
