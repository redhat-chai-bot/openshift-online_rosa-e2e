notes:
  terminal_state_handling: 'SUCCESS is pass; every other terminal state is failed. Raw terminal states are preserved per job in raw_terminal_states and per run in phase-data.json. Observed terminal states across both windows: SUCCESS 2264, FAILURE 1377, UNKNOWN 1. The single UNKNOWN run is a terminal non-success and is therefore counted as failed; it is Prow''s state when a ProwJob reaches a terminal condition without a recorded result, and it is flagged here rather than silently bucketed.'
  pending_handling: Runs with no Result, or Result PENDING, are excluded before any counting. Zero such runs were present in either window.
  window_rule: A run is counted in a window when its completion time (Started + Duration) falls inside that window, not its start time.
  dedup_rule: Deduplicated on (prow_job, build ID) during history pagination; 0 duplicates were encountered across 3642 collected builds.
  pagination: Every job history was paginated backwards via the page Older Runs link until a page contained a build started before 2026-11-08T14:41:51Z, or the job had no further pages. All 206 reachable jobs reached that condition (paginated_complete=true); none hit the 40-page safety cap.
  informing_rule: 'informing: true jobs are excluded from overall, gating, non-gating and per-category pass rates and from category health, but their history is collected and reported.'
  gating_rule: Effective gating is the job-level gating value when present, otherwise the category default. 16 jobs override to false inside gating categories; 16 jobs override to true inside the non-gating sre-operator-e2e category.
  failure_analysis_scope: 'The 5 lowest-rate categories with data were analyzed: hypershift-ci (0%), ocm-fvt-gcp-stg (20%), rosa-gap-analysis (23%), ocm-fvt-osdfm-stg (33%), ocm-fvt-classic-stg (36%). Up to 5 lowest-rate non-informing failed jobs per category were selected; 12 jobs were analyzed against artifacts/junit_operator.xml. Jobs with fail_count>0 that were not analyzed carry an empty failure_classification and a failure_summary saying so, per the artifact schema.'
  artifact_access_limit: CI artifact bytes were not directly reachable from the reporting environment (object storage returned 401 for listing and 403 for object reads, and the artifact browser returned 404 or redirected to a sign-in page). Artifacts were therefore read only through the authorized read path available to the reporter, which costs two requests per run. That is why per-run phase attribution covers 13 of 370 failed runs; the remainder are Unknown(budget_expired), which the phase specification explicitly allows.
  jira: No Jira issue was created, referenced as new, or invented. No repository was edited, no branch pushed, no PR opened.
  correction_history: 'Revision 2 (2026-11-22): analysis-authored failure fields for GCP PSC WIF SV, GCP CCS AD, GCP Root Disk, GCP Non-Cross-Proj WIF, GCP Marketplace, STS AD OCP5, ROSA AD and the three GAP jobs were corrected against the published Prow build logs and CS telemetry artifacts for the named builds. STS AD OCP5 moved from Product bug to Env/config issue: its operator roles were never created because the AWS account hit its IAM RolesPerAccount quota, which supersedes the earlier role-name-truncation hypothesis. Counts, rates, trends, category and job membership are unchanged by this revision.'
trend_rule: 'category and overall trend use a +/-10 percentage-point band on the exact (unrounded) pass-rate delta: improving >= +10, declining <= -10, otherwise stable; no-data when either window has no counted runs'
