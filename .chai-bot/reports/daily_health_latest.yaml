      configured cross-major 4.22.21 -> 5.0.0 hop while the two intra-chain hops succeed every run. Clusters Service accepted
      the upgrade policy and then removed it before it reached the ''started'' state, which is the behaviour expected when
      a scheduled upgrade''s prerequisites are not satisfiable in that environment for that target. This is a mismatch between
      the job''s pinned 5.0.0 target and what the staging environment will schedule, not a flake and not a defect in the
      step graph or the harness plumbing. Determinism: 8 of 8 current-window runs failed (8 consecutive); the two preceding
