notes:
  terminal_state_handling: SUCCESS is pass; every other terminal state is failed. Observed terminal states in the current window were SUCCESS and FAILURE only.
  pending_handling: Runs with a PENDING or absent Result are excluded before counting; 7 such runs were excluded. One build carries Result UNKNOWN with a zero Started timestamp, which places it outside both windows, so it is counted nowhere.
  window_rule: current 2026-11-17T14:50:38Z to 2026-11-24T14:50:38Z; previous 2026-11-10T14:50:38Z to 2026-11-17T14:50:38Z.
  dedup_rule: runs deduplicated by (prow_job, build id).
  pagination: Prow job-history pages were followed through Older Runs links until the oldest build predated the previous window start or no link remained; no job needed a second page. 10 jobs returned under 14 days with pagination exhausted, which is complete coverage, not truncation.
  informing_rule: informing jobs stay in the job list and keep their counts, but are excluded from every rate, trend and category health value.
  gating_rule: 'gating is the effective value: a job-level gating field overrides the category default. 32 jobs carry a job-level override.'
  incomplete_rate_rule: any population whose current window is incomplete records pass_rate -1 and health N/A rather than a confirmed subset figure. The observed subset is kept in the matching *_rate_display field. gating is complete and carries a real rate; overall and non-gating are incomplete because the single fetch-error job is non-informing and non-gating.
  zero_denominator_rule: a complete current window holding no run records pass_count 0, fail_count 0, total 0 and pass_rate null. It is never recorded as 0%.
  failure_analysis_scope: 'analysis was capped at the 5 lowest-health categories: rosa-gap-analysis, ocm-fvt-hcp-prd, hypershift-ci, ocm-fvt-osdfm-stg, ocm-fvt-gcp-stg.'
  artifact_access_limit: only public Prow artifacts and public repository source were read. No cluster or customer identifiers, personal data, credentials, raw log text or private Jira descriptions are reproduced in this artifact.
  consecutive_failure_limit: consecutive_failures counts failed terminal builds newest first within the current window; consecutive_failures_is_lower_bound is true when every run in the window failed, so the true streak may extend further back.
  phase_attribution_note: 'no failure-phase attribution was computed in this run: per-run artifacts were not inspected beyond the five analyzed categories.'
failure_analysis:
  scope: Capped at the 5 lowest-health categories (rosa-gap-analysis, ocm-fvt-hcp-prd, hypershift-ci, ocm-fvt-osdfm-stg, ocm-fvt-gcp-stg). Failing jobs in every other category are deliberately left unclassified - empty failure_classification, failing_tests, failure_summary and diagnosis - because their logs were not analyzed, not because they are benign.
  jobs_analyzed: 13
  failing_tests_note: failing_tests is populated only where an exact failing step or test name was established; it is left empty rather than inferred from log prose.
  findings:
  - category_id: hypershift-ci
    category_name: HyperShift CI
    jobs:
    - STG HCP 4.22
    classification: Env/config issue
    summary: rosa-cluster-wait-ready-cluster failed after the cluster remained in state installing with no state progress for 60 minutes. Post diagnostics also reported Forbidden on cluster-scoped resources, not proven to cause the readiness stall.
    references: []
  - category_id: ocm-fvt-hcp-prd
    category_name: OCM FVT HCP PROD
    jobs:
    - HCP AD
    classification: Env/config issue
    summary: Three HCP Spot Instances organization feature-review checks expected HTTP 200 and got 403; artifacts had no matching clusters-service telemetry. The log does not distinguish credential/authorization setup from service behavior.
    references: []
  - category_id: rosa-gap-analysis
    category_name: GAP E2E
    jobs:
    - GAP 4.19
    - GAP 4.20
    - GAP 4.21
    - GAP 4.22
    - GAP 5.0
    classification: Test bug
    summary: 'All five tracked versions are 0/7 in the current window. Every sampled latest log fails during GA version resolution because Sippy ga_dates contains nonnumeric key(s): ''ga_dates holds 20 key(s), at least one of which is not a numeric version''.'
    references:
    - ROSAENG-76634
    - https://github.com/openshift-online/rosa-gap-analysis/pull/106
    - https://github.com/openshift-online/rosa-gap-analysis/pull/107
    remediation: An open tracking bug and two matching public fix PRs already exist. Do not open a new PR and do not modify the existing PRs; their review status is not a reason to create a duplicate.
  - category_id: ocm-fvt-osdfm-stg
    category_name: OCM FVT OSDFM STG
    jobs:
    - OSDFM Basic Periodic
    classification: Resilience / de-flake
    summary: Cleanup waited 2700 seconds and remained in cleanup. Telemetry had lifecycle error events but the payload reports backend logs and conditions unavailable and the cause unknown.
    references: []
  - category_id: ocm-fvt-gcp-stg
    category_name: OCM FVT GCP STG
    jobs:
    - GCP Marketplace
    - GCP PSC WIF SV
    - GCP CCS AD
    - GCP Root Disk
    - GCP Non-Cross-Proj WIF
    classification: Env/config issue
    summary: Top five failing jobs. Marketplace installation stayed pending instead of installing after a 40-minute wait; PSC WIF SV's GCP PSC IAP tunnel exited before ready; CCS AD, Root Disk and Non-Cross-Proj WIF each logged 'WIF lookup unavailable' in the setup helper.
    telemetry_note: clusters-service telemetry was inspected for the jobs where the artifact existed and did not add a specific cause beyond the build-log evidence; GCP Root Disk had no CS telemetry artifact listing.
    references: []
