    - fleet-manager cluster cleanup state-convergence check (45-minute budget)
    failure_summary: Cluster cleanup never advances past the cleanup state and times out after 45 minutes,
      failing both the pre-clean and post-clean suite steps.
    diagnosis: 'Classification: Product bug. The cleanup state machine remained in the cleanup state for
      the entire 45-minute budget while the harness performed 17 successful state reads with zero read
      errors, so the state was observable and simply never advanced, indicating a service-side fleet-manager
      deprovision stall rather than a harness or transport fault. Confidence low-to-moderate and the uncertainty
      is material: the suite itself reports the cause as unknown with backend logs unavailable and conditions
      not exposed through the SDK, so the stall is not localised and a load-dependent slow cleanup against
      a too-tight budget (Resilience / de-flake) cannot be excluded. Collected CS telemetry shows many
      unrelated clusters completing install, ready and deprovision transitions normally in the same window,
      so it does not isolate this cluster.'
