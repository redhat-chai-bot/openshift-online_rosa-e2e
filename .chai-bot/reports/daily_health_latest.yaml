methodology:
  outcomes: Count non-PENDING SUCCESS and FAILURE records by Started within each half-open seven-day window in the
    supplied history snapshot. Duration is not used to change the supplied window membership.
  rates: Weighted run rates; headline percentages rounded to integers and detailed rates retain source precision.
    No-run rates are -1.
  trend: 'Use exact current minus previous rate: at least 10 percentage points improving, at most -10 degrading,
    otherwise stable. Missing rates mean insufficient_data.'
  gating: Explicit job gating overrides category gating; default false. Team and labels use job overrides when present.
  consecutive_failures: Current-window records sorted by Started and numeric build ID descending; stop at first
    SUCCESS.
  latest_failure: Most recent current-window FAILURE; date is Started in UTC. A zero streak can coexist with earlier
    failures.
  analysis: Only the 18 selected failing jobs are analyzed. Findings describe inspected public runs, not every failure
    across the version. Other jobs have empty failure analysis fields. Descriptive case or step labels are used
    where full test titles were not supplied.
  classification: Product bug, Env/config issue, Test bug, or Resilience / de-flake. An observed secondary defect
    does not establish the primary cause.
  fetch_error: Counts -1/-1, total 0, rate -1, streak 0 and classification fetch_error. Unknown histories are excluded
    from aggregates, which mark incomplete coverage. Successful empty histories have counts 0/0, total 0 and rate
    -1.
  privacy: Team name and public labels only; routing identifiers, identities, issue keys and content, private identifiers,
    raw logs and sensitive values are omitted. Evidence links are public Prow job URLs only.
