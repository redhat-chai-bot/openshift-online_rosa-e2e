methodology:
  outcomes: Count completed SUCCESS and FAILURE runs by Started within the supplied half-open UTC seven-day windows;
    exclude nonterminal, indeterminate and runs finishing after the reporting cutoff.
  rates: Run-weighted SUCCESS / (SUCCESS + FAILURE). Category and headline percentages are rounded integers; detailed
    and previous rates retain source precision. No-run rates are -1.
  trend: 'Preserve supplied rollup direction: up is improving, down is degrading, flat is stable. Missing comparisons
    are stable with null change_percentage_points.'
  gating: Job gating overrides category gating; default false. Team id/name and labels come from the exact public
    registry snapshot, with routing fields empty.
  consecutive_failures: Newest completed runs in fetched history, not limited to the current week; stop at the first
    non-FAILURE. Lower-bound flags identify truncated streaks. A separate 14-day streak is retained.
  latest_failure: Most recent observed completed FAILURE before the reporting cutoff; date is Started in UTC and
    may be outside the current week. Empty means none observed, not none ever.
  analysis: Only the 21 explicitly supplied diagnoses are applied to jobs with current-week failures. An earlier
    in-week failure can be diagnosed even when the latest build passed. Other analysis fields remain empty; missing
    exact test names are not invented.
  classification: Product bug, Env/config issue, Test bug, or Resilience / de-flake. Separate secondary symptoms
    do not establish the primary cause.
  fetch_error: Counts -1/-1, total 0, rate -1, streak 0 and classification fetch_error in both weekly metrics. Unknown
    histories are excluded from aggregates and mark incomplete coverage; they are not no-runs.
  privacy: All team routing fields are empty. No private issue content or links, routing values, run-specific customer
    or resource identifiers, or raw logs are included. Evidence links are public Prow builds and explicitly supplied
    public pull requests.
